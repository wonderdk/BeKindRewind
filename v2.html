<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be Kind, Rewind — Video Rental (3D)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --neon-core:#ffd9a8; --neon-glow:#ff7a00;
  --text:#c9b79c; --text-dim:#7d6a52;
  --sticker-yellow:#e9c832; --ink:#2b2118;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0d0906;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
#c{display:block;width:100%;height:100%}
/* HUD */
#loading{
  position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:#0d0906;z-index:100;
}
#loading .neon{
  font-weight:700;letter-spacing:.16em;font-size:clamp(20px,4.5vw,38px);color:var(--neon-core);
  text-shadow:0 0 4px #ffb054,0 0 14px #ff8a00,0 0 36px #ff6a00;
}
#loading .sub{font-size:12px;color:var(--text-dim);letter-spacing:.2em}
#crosshair{
  position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;
  background:rgba(255,217,168,.85);box-shadow:0 0 6px rgba(255,140,40,.9);z-index:20;pointer-events:none;display:none;
}
#hover{
  position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:20;pointer-events:none;display:none;
  background:rgba(16,7,3,.85);border:1px solid #3a2413;border-radius:3px;padding:7px 14px;
  font-size:13px;color:#e8dcc4;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis;
}
#hover .dim{color:var(--text-dim);font-size:11px}
#hint{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;pointer-events:none;
  font-size:11px;letter-spacing:.06em;color:var(--text-dim);
  background:rgba(13,9,6,.7);padding:5px 12px;border-radius:3px;white-space:nowrap;
}
#topbar{position:fixed;top:12px;left:12px;z-index:20;display:flex;gap:8px}
.hud-link{
  background:rgba(20,10,4,.8);border:1px solid #3a2413;color:#ffc07a;
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  padding:7px 12px;text-decoration:none;border-radius:2px;
  text-shadow:0 0 8px rgba(255,130,20,.6);
}
.hud-link:hover{border-color:#6b4326}
/* touch controls */
#touch{position:fixed;bottom:18px;left:18px;z-index:20;display:none;gap:10px}
.tbtn{
  width:56px;height:56px;border-radius:50%;border:1px solid #3a2413;background:rgba(20,10,4,.75);
  color:#ffc07a;font-size:20px;line-height:1;user-select:none;-webkit-user-select:none;touch-action:none;
}
/* pulled-out case overlay (same as the 2D store) */
.pull-overlay{position:fixed;inset:0;z-index:200;background:rgba(6,3,2,.88);display:none;align-items:center;justify-content:center;padding:20px}
.pull-overlay.open{display:flex}
.pull-case{width:min(320px,86vw);perspective:1200px}
.pull-inner{position:relative;width:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,1.4,.6,1)}
.pull-inner.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){.pull-inner{transition:none}}
.pull-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 6px 6px 3px;box-shadow:0 18px 60px rgba(0,0,0,.9),0 0 80px rgba(255,110,0,.08)}
.pull-front{position:relative}
.pull-front img{width:100%;display:block;border-radius:3px 6px 6px 3px;aspect-ratio:2/3;object-fit:cover;background:#17171f}
.pull-front .no-art{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:18px;color:var(--text);background:linear-gradient(160deg,#2a2a36,#17171f);border-radius:3px 6px 6px 3px}
.pull-back{position:absolute;inset:0;transform:rotateY(180deg);background:linear-gradient(170deg,#1d1510,#110c08);border:1px solid #35251a;color:#cfc0a4;padding:16px 16px 14px;font-size:12px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
.pull-back h2{font-size:15px;color:var(--neon-core);margin-bottom:2px;line-height:1.25;font-weight:700;text-shadow:0 0 10px rgba(255,120,20,.35)}
.pull-back .da-title{font-style:italic;color:#8f7a5c;font-size:11px;margin-bottom:8px}
.pull-back .synopsis{flex:1;overflow-y:auto;margin-bottom:10px;color:#bfae92}
.pull-back .meta-line{font-size:10.5px;color:#8a7458;margin-bottom:3px}
.pull-back .meta-line b{color:#c2a87f;font-weight:600}
.watched-stamp{position:absolute;top:12px;right:12px;border:2px solid;border-radius:3px;font-size:11px;padding:2px 7px;transform:rotate(9deg);opacity:.9}
.stamp-yes{color:#7ec98a;border-color:#7ec98a}
.stamp-no{color:var(--sticker-yellow);border-color:var(--sticker-yellow)}
.barcode{height:26px;margin-top:auto;opacity:.7;background:repeating-linear-gradient(90deg,#cfc0a4 0 2px,transparent 2px 4px,#cfc0a4 4px 7px,transparent 7px 9px,#cfc0a4 9px 10px,transparent 10px 14px)}
.pull-hint{text-align:center;margin-top:14px;font-size:12px;color:#a98c62}
.pull-close{position:absolute;top:-14px;right:-14px;z-index:5;width:34px;height:34px;border-radius:50%;background:#b3402a;color:#f2e8d0;border:none;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 3px 9px rgba(0,0,0,.7)}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0d0906;z-index:150;padding:24px;text-align:center;line-height:1.7}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const CSV_URL = 'https://raw.githubusercontent.com/wonderdk/bekindrewind/main/movies.csv';
const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxZTY3N2ZiMTVjMGM4ZDBkNTMzNjQzMGYxNmNlOTFmMiIsIm5iZiI6MTc3NjQxMjk3Mi4zMDIsInN1YiI6IjY5ZTFlOTJjNmJlM2VmOWRmZThiN2I1MCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.LmxBN4pTZr1OsghaHWA2LkbrqJrGNqftKmyQ1ZUNOQA';

const SECTIONS = [
  { id:'horror',   label:'HORROR',              genres:['Horror'],                            tint:0x5a1c1c },
  { id:'scifi',    label:'SCIENCE FICTION',     genres:['Sci-Fi','Science Fiction'],          tint:0x24384a },
  { id:'crime',    label:'CRIME',               genres:['Crime'],                             tint:0x3a3020 },
  { id:'thriller', label:'THRILLER',            genres:['Thriller','Mystery'],                tint:0x2c2436 },
  { id:'action',   label:'ACTION',              genres:['Action','War','Western'],            tint:0x4a2a16 },
  { id:'fantasy',  label:'FANTASY & ADVENTURE', genres:['Fantasy','Adventure'],               tint:0x2a3a28 },
  { id:'kids',     label:'ANIMATION & KIDS',    genres:['Animation','Family'],                tint:0x3d3218 },
  { id:'comedy',   label:'COMEDY',              genres:['Comedy','Music'],                    tint:0x453a1a },
  { id:'drama',    label:'DRAMA',               genres:['Drama','Romance','History','Documentary'], tint:0x33261e },
  { id:'misc',     label:'MISC',                genres:[],                                    tint:0x2a2a2a }
];

/* ── shared helpers (same behavior as the 2D store) ── */
function parseCSV(text) {
  const rows = [];
  const lines = text.trim().split('\n');
  const parseLine = (line) => {
    const vals = []; let cur = '', inQ = false;
    for (let j = 0; j < line.length; j++) {
      const c = line[j];
      if (c === '"') { if (inQ && line[j+1] === '"') { cur += '"'; j++; continue; } inQ = !inQ; continue; }
      if (c === ',' && !inQ) { vals.push(cur.trim()); cur = ''; continue; }
      cur += c;
    }
    vals.push(cur.trim());
    return vals;
  };
  const headers = parseLine(lines[0]);
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseLine(lines[i]);
    if (vals.length < headers.length) continue;
    const obj = {};
    headers.forEach((h, idx) => obj[h] = vals[idx] || '');
    if (obj.uid) rows.push(obj);
  }
  return rows;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sectionFor(m) {
  const genres = (m.genre_ids || '').split('|').map(g => g.trim()).filter(Boolean);
  for (const s of SECTIONS) if (s.genres.some(g => genres.includes(g))) return s;
  return SECTIONS[SECTIONS.length - 1];
}
function seededPicks(pool, n) {
  const d = new Date();
  let seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  const rand = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
  const arr = pool.slice();
  for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(rand()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; }
  return arr.slice(0, n);
}

/* ── shelf slot layout (pure math, no THREE) ──
   Room: x in [-7,7], z in [-13,4]. Back wall holds the neon.
   Faces are filled in walking order; each returns slot positions. */
const LEVELS = [0.38, 0.97, 1.56, 2.15];
const SLOT = 0.165;
function buildFaces() {
  // {x0,z0: first slot; dx,dz: advance per slot; rotY: facing; len: run length}
  return [
    { name:'westWall', x0:-6.70, z0: 2.60, dx:0, dz:-SLOT, rotY: Math.PI/2,  len:15.0 },
    { name:'A-west',   x0:-2.92, z0: 0.60, dx:0, dz:-SLOT, rotY:-Math.PI/2, len:12.0 },
    { name:'A-east',   x0:-2.28, z0: 0.60, dx:0, dz:-SLOT, rotY: Math.PI/2,  len:12.0 },
    { name:'B-west',   x0: 2.28, z0: 0.60, dx:0, dz:-SLOT, rotY:-Math.PI/2, len:12.0 },
    { name:'B-east',   x0: 2.92, z0: 0.60, dx:0, dz:-SLOT, rotY: Math.PI/2,  len:12.0 },
    { name:'eastWall', x0: 6.70, z0: 2.60, dx:0, dz:-SLOT, rotY:-Math.PI/2, len:15.0 },
    { name:'backWall', x0:-6.20, z0:-12.72, dx:SLOT, dz:0, rotY:0,           len:12.4 }
  ];
}
function assignSlots(bySection) {
  const faces = buildFaces();
  const placements = [], signs = [];
  let f = 0, level = 0, i = 0;
  const perFace = faces.map(fc => Math.floor(fc.len / SLOT));
  const nextSlot = () => {
    while (f < faces.length) {
      if (i < perFace[f]) {
        const fc = faces[f];
        const slot = { x: fc.x0 + fc.dx*i, z: fc.z0 + fc.dz*i, y: LEVELS[level], rotY: fc.rotY, face: fc.name };
        // advance: fill a whole level along the face, then next level, then next face
        i++;
        if (i >= perFace[f]) { i = 0; level++; if (level >= LEVELS.length) { level = 0; f++; } }
        return slot;
      }
      i = 0; level = 0; f++;
    }
    return null;
  };
  for (const sec of SECTIONS) {
    const films = bySection[sec.id] || [];
    if (!films.length) continue;
    let first = true;
    for (const m of films) {
      const slot = nextSlot();
      if (!slot) return { placements, signs, overflow: true };
      if (first) { signs.push({ label: sec.label, x: slot.x, z: slot.z, rotY: slot.rotY }); first = false; }
      placements.push({ m, sec, ...slot });
    }
  }
  return { placements, signs, overflow: false };
}

/* ── canvas textures: neon sign, section signs, carpet, taped note ── */
function neonCanvas(text, sub) {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 300;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(10,5,2,0.001)'; x.fillRect(0,0,c.width,c.height);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '700 118px Arial Narrow, Arial, sans-serif';
  for (const [blur, col] of [[70,'rgba(255,90,0,.85)'],[34,'#ff6a00'],[14,'#ff8a00']]) {
    x.shadowColor = col; x.shadowBlur = blur; x.fillStyle = '#ffd9a8';
    x.fillText(text, c.width/2, 128);
  }
  x.shadowBlur = 0; x.fillStyle = '#ffe9c8'; x.fillText(text, c.width/2, 128);
  if (sub) {
    x.font = '600 34px Arial, sans-serif';
    x.shadowColor = '#ff8a00'; x.shadowBlur = 16; x.fillStyle = '#e0a35f';
    x.fillText(sub, c.width/2, 236);
    x.shadowBlur = 0;
  }
  return c;
}
function signCanvas(text) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 128;
  const x = c.getContext('2d');
  x.fillStyle = '#140b05'; x.fillRect(0,0,c.width,c.height);
  x.strokeStyle = '#3a2413'; x.lineWidth = 6; x.strokeRect(3,3,c.width-6,c.height-6);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  let size = 54;
  x.font = `600 ${size}px Arial Narrow, Arial, sans-serif`;
  while (x.measureText(text).width > 460 && size > 26) { size -= 4; x.font = `600 ${size}px Arial Narrow, Arial, sans-serif`; }
  x.shadowColor = '#ff8a00'; x.shadowBlur = 22; x.fillStyle = '#ffd9a8';
  x.fillText(text, c.width/2, c.height/2 + 2);
  x.shadowBlur = 8; x.fillText(text, c.width/2, c.height/2 + 2);
  return c;
}
function noteCanvas(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 96;
  const x = c.getContext('2d');
  x.fillStyle = '#e9c832'; x.fillRect(0,0,c.width,c.height);
  x.fillStyle = '#2b2118'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'italic 700 26px Comic Sans MS, cursive, sans-serif';
  x.fillText(text, c.width/2, c.height/2);
  return c;
}
function carpetCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#3a1013'; x.fillRect(0,0,256,256);
  for (let i = 0; i < 2600; i++) {
    const v = Math.random();
    x.fillStyle = v < .5 ? 'rgba(0,0,0,.22)' : 'rgba(120,40,40,.18)';
    x.fillRect(Math.random()*256, Math.random()*256, 2, 2);
  }
  return c;
}

/* ── the store ── */
let renderer, scene, camera, movies = [];
const posterMeshes = [];
const colliders = []; // {minX,maxX,minZ,maxZ}
const texState = new Map(); // uid -> {mesh, url, tex|null, loading}
const overviewCache = new Map();
let locked = false, yaw = Math.PI, pitch = 0;
const keys = {};
let touchFwd = 0;

function fail(msg) {
  document.getElementById('loading').style.display = 'none';
  const f = document.getElementById('fatal');
  f.style.display = 'flex';
  f.innerHTML = msg + '<br><br><a class="hud-link" href="store.html">Go to the 2D store</a>';
}

function box(w,h,d,color,x,y,z,emissive) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
    new THREE.MeshLambertMaterial({ color, emissive: emissive || 0x000000 }));
  m.position.set(x,y,z); scene.add(m); return m;
}
function addCollider(minX,maxX,minZ,maxZ){ colliders.push({minX,maxX,minZ,maxZ}); }

function buildRoom() {
  scene.background = new THREE.Color(0x0d0906);
  scene.fog = new THREE.Fog(0x0d0906, 7, 26);

  // carpet
  const carpetTex = new THREE.CanvasTexture(carpetCanvas());
  carpetTex.wrapS = carpetTex.wrapT = THREE.RepeatWrapping; carpetTex.repeat.set(10, 12);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(14, 17), new THREE.MeshLambertMaterial({ map: carpetTex }));
  floor.rotation.x = -Math.PI/2; floor.position.set(0, 0, -4.5); scene.add(floor);

  // ceiling + walls
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(14, 17), new THREE.MeshLambertMaterial({ color: 0x14100b }));
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, 3.1, -4.5); scene.add(ceil);
  const wallMat = new THREE.MeshLambertMaterial({ color: 0x171009 });
  const mkWall = (w,h,x,y,z,ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat); m.position.set(x,y,z); m.rotation.y = ry; scene.add(m); };
  mkWall(14, 3.1,  0, 1.55, -13, 0);            // back
  mkWall(14, 3.1,  0, 1.55,   4, Math.PI);      // front
  mkWall(17, 3.1, -7, 1.55, -4.5,  Math.PI/2);  // west
  mkWall(17, 3.1,  7, 1.55, -4.5, -Math.PI/2);  // east

  // shelf carcasses (dark wood boxes behind the case faces)
  const woodDark = 0x1b110a;
  box(0.4, 2.6, 15.6, woodDark, -6.9, 1.3, -4.9);  addCollider(-7.2,-6.55, -12.8, 3.0);
  box(0.4, 2.6, 15.6, woodDark,  6.9, 1.3, -4.9);  addCollider( 6.55, 7.2, -12.8, 3.0);
  box(13.0, 2.6, 0.4, woodDark,  0,  1.3, -12.9);  addCollider(-6.6, 6.6, -13.2, -12.55);
  box(0.6, 2.6, 12.4, woodDark, -2.6, 1.3, -5.4);  addCollider(-3.05,-2.15, -11.75, 0.95);
  box(0.6, 2.6, 12.4, woodDark,  2.6, 1.3, -5.4);  addCollider( 2.15, 3.05, -11.75, 0.95);
  // shelf boards (visual lines at each level)
  const boardMat = new THREE.MeshLambertMaterial({ color: 0x2a1a0e });
  const addBoards = (x, z, w, d) => { for (const y of [...LEVELS, 2.72]) { const b = new THREE.Mesh(new THREE.BoxGeometry(w, 0.03, d), boardMat); b.position.set(x, y - 0.03, z); scene.add(b); } };
  addBoards(-6.68, -4.9, 0.28, 15.4);
  addBoards( 6.68, -4.9, 0.28, 15.4);
  addBoards(-2.6, -5.4, 0.72, 12.2);
  addBoards( 2.6, -5.4, 0.72, 12.2);
  addBoards( 0, -12.68, 12.9, 0.28);

  // fluorescent tubes + cool lights down the aisles
  const tubeMat = new THREE.MeshLambertMaterial({ color: 0xe9f2f4, emissive: 0xdfeef2 });
  const tubeGeo = new THREE.BoxGeometry(0.08, 0.04, 1.4);
  for (const tx of [-4.8, 0, 4.8]) {
    for (const tz of [-10.5, -6, -1.5, 2.5]) {
      const t = new THREE.Mesh(tubeGeo, tubeMat); t.position.set(tx, 3.02, tz); scene.add(t);
      const fixture = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.03, 1.5), new THREE.MeshLambertMaterial({ color: 0x241a12 }));
      fixture.position.set(tx, 3.06, tz); scene.add(fixture);
      const pl = new THREE.PointLight(0xdfeef2, 0.42, 6.5); pl.position.set(tx, 2.85, tz); scene.add(pl);
    }
  }

  // neon sign on the back wall + orange spill
  const neonTex = new THREE.CanvasTexture(neonCanvas('VIDEO RENTAL', 'BE KIND, REWIND'));
  const neon = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 1.35),
    new THREE.MeshBasicMaterial({ map: neonTex, transparent: true }));
  neon.position.set(0, 2.32, -12.95); scene.add(neon);
  const orange = new THREE.PointLight(0xff7a00, 1.5, 17); orange.position.set(0, 2.2, -11.6); scene.add(orange);
  const orangeFill = new THREE.PointLight(0xff8a20, 0.35, 10); orangeFill.position.set(0, 1.4, -6); scene.add(orangeFill);

  // warm base ambience
  scene.add(new THREE.AmbientLight(0x8a6a4a, 0.34));

  // counter by the entrance
  box(2.4, 1.0, 0.9, 0x22150c, 4.6, 0.5, 2.4); addCollider(3.3, 5.9, 1.85, 2.95);
  const lamp = new THREE.PointLight(0xffc27a, 0.5, 4); lamp.position.set(4.6, 1.5, 2.4); scene.add(lamp);
  const note = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.19),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(noteCanvas('PLEASE REWIND!')) }));
  note.position.set(4.6, 1.05, 1.94); note.rotation.y = Math.PI; scene.add(note);
}

const CASE_W = 0.135, CASE_H = 0.19;
function buildCases() {
  const visible = movies.filter(m => m.hidden !== 'true');
  const bySection = {};
  SECTIONS.forEach(s => bySection[s.id] = []);
  visible.forEach(m => bySection[sectionFor(m).id].push(m));
  SECTIONS.forEach(s => bySection[s.id].sort((a,b) => a.title.localeCompare(b.title)));

  const { placements, signs, overflow } = assignSlots(bySection);
  if (overflow) console.warn('shelf capacity exceeded; some films not placed');

  // instanced case bodies: one draw call for every case back
  const bodyGeo = new THREE.BoxGeometry(CASE_W + 0.006, CASE_H + 0.008, 0.028);
  const bodyMat = new THREE.MeshLambertMaterial({ color: 0x141218 });
  const bodies = new THREE.InstancedMesh(bodyGeo, bodyMat, placements.length);
  const dummy = new THREE.Object3D();

  const planeGeo = new THREE.PlaneGeometry(CASE_W, CASE_H);
  placements.forEach((p, idx) => {
    const nx = Math.sin(p.rotY), nz = Math.cos(p.rotY); // face normal
    dummy.position.set(p.x, p.y + CASE_H/2, p.z);
    dummy.rotation.set(0, p.rotY, 0);
    dummy.updateMatrix();
    bodies.setMatrixAt(idx, dummy.matrix);

    const mat = new THREE.MeshLambertMaterial({ color: p.sec.tint });
    const plane = new THREE.Mesh(planeGeo, mat);
    plane.position.set(p.x + nx*0.017, p.y + CASE_H/2, p.z + nz*0.017);
    plane.rotation.y = p.rotY;
    plane.userData.m = p.m;
    scene.add(plane);
    posterMeshes.push(plane);
    if (p.m.poster_url) {
      texState.set(p.m.uid, { mesh: plane, url: p.m.poster_url.replace('/w300','/w185'), tex: null, loading: false });
    }
  });
  scene.add(bodies);

  // section signs above the first case of each section
  for (const s of signs) {
    const nx = Math.sin(s.rotY), nz = Math.cos(s.rotY);
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.38),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(signCanvas(s.label)), transparent: false }));
    sign.position.set(s.x + nx*0.06, 2.62, s.z + nz*0.06);
    sign.rotation.y = s.rotY;
    scene.add(sign);
  }

  // tonight's picks gondola in the center aisle
  const picks = seededPicks(visible.filter(m => m.watched !== 'true' && m.poster_url), 5);
  if (picks.length) {
    box(1.15, 0.95, 0.8, 0x22150c, 0, 0.475, -4); addCollider(-0.75, 0.75, -4.55, -3.45);
    const noteMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.2),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(noteCanvas("TONIGHT'S PICKS")) }));
    noteMesh.position.set(0, 1.32, -3.58); scene.add(noteMesh);
    picks.forEach((m, k) => {
      const mat = new THREE.MeshLambertMaterial({ color: 0x2a2a36 });
      const plane = new THREE.Mesh(planeGeo, mat);
      plane.position.set(-0.42 + k*0.21, 1.06, -3.585);
      plane.userData.m = m;
      scene.add(plane);
      posterMeshes.push(plane);
      texState.set('pick-' + m.uid, { mesh: plane, url: m.poster_url.replace('/w300','/w185'), tex: null, loading: false });
    });
  }
}

/* ── proximity texture streaming ── */
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
const TEX_BUDGET = 240, LOAD_NEAR = 9, CONCURRENT = 6;
let inflight = 0;
function streamTextures() {
  const cx = camera.position.x, cz = camera.position.z;
  const entries = [...texState.values()];
  for (const e of entries) {
    const dx = e.mesh.position.x - cx, dz = e.mesh.position.z - cz;
    e.d2 = dx*dx + dz*dz;
  }
  entries.sort((a,b) => a.d2 - b.d2);
  let loaded = entries.filter(e => e.tex).length;
  for (const e of entries) {
    if (inflight >= CONCURRENT) break;
    if (e.tex || e.loading) continue;
    if (e.d2 > LOAD_NEAR*LOAD_NEAR) break;
    if (loaded >= TEX_BUDGET) break;
    e.loading = true; inflight++;
    texLoader.load(e.url, tex => {
      inflight--; e.loading = false; e.tex = tex;
      e.mesh.material.map = tex;
      e.mesh.material.color.set(0xffffff);
      e.mesh.material.needsUpdate = true;
    }, undefined, () => { inflight--; e.loading = false; e.failed = true; e.tex = false; });
    loaded++;
  }
  // evict farthest when over budget
  const withTex = entries.filter(e => e.tex && e.tex !== false);
  if (withTex.length > TEX_BUDGET) {
    withTex.sort((a,b) => b.d2 - a.d2);
    for (let i = 0; i < withTex.length - TEX_BUDGET; i++) {
      const e = withTex[i];
      e.mesh.material.map = null;
      e.mesh.material.color.set(0x2a2a36);
      e.mesh.material.needsUpdate = true;
      e.tex.dispose(); e.tex = null;
    }
  }
}

/* ── movement + look ── */
function setupControls(canvas) {
  canvas.addEventListener('click', () => {
    if (document.getElementById('pull-overlay').classList.contains('open')) return;
    if (!locked) { canvas.requestPointerLock?.(); return; }
    // locked click: pull the case under the crosshair
    if (hovered) openCase(hovered.userData.m);
  });
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === canvas;
    document.getElementById('crosshair').style.display = locked ? 'block' : 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!locked) return;
    yaw   -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
  });
  document.addEventListener('keydown', e => { keys[e.code] = true; });
  document.addEventListener('keyup',   e => { keys[e.code] = false; });

  // touch: drag to look, hold buttons to move
  let lastTouch = null;
  canvas.addEventListener('touchstart', e => { lastTouch = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (lastTouch) {
      yaw   -= (t.clientX - lastTouch.clientX) * 0.004;
      pitch -= (t.clientY - lastTouch.clientY) * 0.004;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    }
    lastTouch = t;
  }, { passive: true });
  canvas.addEventListener('touchend', () => { lastTouch = null; }, { passive: true });
  const bind = (id, v) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); touchFwd = v; }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); touchFwd = 0; }, { passive: false });
  };
  bind('t-fwd', 1); bind('t-back', -1);
  if ('ontouchstart' in window) {
    document.getElementById('touch').style.display = 'flex';
    document.getElementById('hint').textContent = 'Drag to look · hold ▲ to walk · tap a cover to pull it';
    // tap-to-open on touch: tap = raycast at tap point
    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length !== 1) return;
      const t = e.changedTouches[0];
      const hit = raycastAt((t.clientX / innerWidth) * 2 - 1, -(t.clientY / innerHeight) * 2 + 1);
      if (hit) openCase(hit.userData.m);
    }, { passive: true });
  }
}
function movePlayer(dt) {
  const speed = 2.8;
  let fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + touchFwd;
  let strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (!fwd && !strafe) return;
  const len = Math.hypot(fwd, strafe) || 1;
  fwd /= len; strafe /= len;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  const dx = (-sin * fwd + cos * strafe) * speed * dt;
  const dz = (-cos * fwd - sin * strafe) * speed * dt;
  const r = 0.32;
  const blocked = (x, z) => {
    if (x < -6.5 + r && x > -7) {} // walls handled by clamp below
    for (const c of colliders) {
      if (x > c.minX - r && x < c.maxX + r && z > c.minZ - r && z < c.maxZ + r) return true;
    }
    return false;
  };
  let nx = camera.position.x + dx;
  if (nx < -6.6 + r) nx = -6.6 + r; if (nx > 6.6 - r) nx = 6.6 - r;
  if (!blocked(nx, camera.position.z)) camera.position.x = nx;
  let nz = camera.position.z + dz;
  if (nz < -12.5 + r) nz = -12.5 + r; if (nz > 3.6 - r) nz = 3.6 - r;
  if (!blocked(camera.position.x, nz)) camera.position.z = nz;
}

/* ── hover + open ── */
const raycaster = new THREE.Raycaster();
raycaster.far = 4.5;
let hovered = null;
function raycastAt(ndcX, ndcY) {
  raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const hits = raycaster.intersectObjects(posterMeshes, false);
  return hits.length ? hits[0].object : null;
}
function updateHover() {
  hovered = locked ? raycastAt(0, 0) : null;
  const el = document.getElementById('hover');
  if (hovered) {
    const m = hovered.userData.m;
    el.innerHTML = `${escHtml(m.title)} <span class="dim">(${escHtml(m.year)}) · ${escHtml(m.format)}${m.watched === 'true' ? '' : ' · NOT SEEN'}</span>`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

/* ── the flip-case overlay (same as 2D store) ── */
const overlay = document.getElementById('pull-overlay');
const inner = document.getElementById('pull-inner');
async function fetchOverview(m) {
  if (overviewCache.has(m.uid)) return overviewCache.get(m.uid);
  if (!/^tt\d{7,8}$/.test(m.imdb_id) || m.imdb_id === 'tt0000000') return '';
  try {
    const hdrs = { Authorization: `Bearer ${TMDB_TOKEN}` };
    const f = await fetch(`https://api.themoviedb.org/3/find/${m.imdb_id}?external_source=imdb_id`, { headers: hdrs }).then(r => r.json());
    const id0 = f.movie_results?.[0]?.id;
    const id = id0 || f.tv_results?.[0]?.id;
    const kind = id0 ? 'movie' : 'tv';
    if (!id) return '';
    const d = await fetch(`https://api.themoviedb.org/3/${kind}/${id}`, { headers: hdrs }).then(r => r.json());
    const ov = d.overview || '';
    overviewCache.set(m.uid, ov);
    return ov;
  } catch(e) { return ''; }
}
async function openCase(m) {
  if (!m) return;
  document.exitPointerLock?.();
  const front = document.getElementById('pull-front');
  const back = document.getElementById('pull-back');
  inner.classList.remove('flipped');
  front.innerHTML = m.poster_url
    ? `<img src="${escHtml(m.poster_url.replace('/w300','/w500'))}" alt="${escHtml(m.title)}">`
    : `<div class="no-art">${escHtml(m.title)}</div>`;
  const watched = m.watched === 'true';
  const actors = (m.actors || '').split('|').filter(a => a && a !== '-').join(', ');
  back.innerHTML = `
    <div class="watched-stamp ${watched ? 'stamp-yes' : 'stamp-no'}">${watched ? 'SEEN' : 'NOT SEEN'}</div>
    <h2>${escHtml(m.title)}</h2>
    ${m.title_da && m.title_da !== m.title ? `<div class="da-title">${escHtml(m.title_da)}</div>` : '<div class="da-title"></div>'}
    <div class="synopsis" id="pull-synopsis">Fetching the back-cover text…</div>
    ${m.director ? `<div class="meta-line"><b>Director:</b> ${escHtml(m.director)}</div>` : ''}
    ${actors ? `<div class="meta-line"><b>Starring:</b> ${escHtml(actors)}</div>` : ''}
    <div class="meta-line"><b>${escHtml(m.year)}</b> · ${escHtml(m.format)}${m.runtime && m.runtime !== '0' ? ` · ${escHtml(m.runtime)} min` : ''}${m.box_set ? ` · From the box set: ${escHtml(m.box_set)}` : ''}</div>
    <div class="barcode"></div>`;
  overlay.classList.add('open');
  const ov = await fetchOverview(m);
  const syn = document.getElementById('pull-synopsis');
  if (syn) syn.textContent = ov || 'The back-cover text has gone missing. Ask at the counter.';
}
inner.addEventListener('click', e => { if (e.target.id !== 'pull-close') inner.classList.toggle('flipped'); });
document.getElementById('pull-close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });

/* ── boot ── */
async function init() {
  const canvas = document.getElementById('c');
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  } catch(e) {
    return fail('Your browser could not start WebGL, so the 3D store cannot open.');
  }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.05, 60);
  camera.position.set(0, 1.62, 3.2);

  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    movies = parseCSV(await res.text());
  } catch(e) {
    return fail('The shop could not open: the film database did not load. Check your connection and reload.');
  }

  buildRoom();
  buildCases();
  setupControls(canvas);

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  document.getElementById('loading').style.display = 'none';

  let last = performance.now(), frame = 0, lastStream = 0;
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    movePlayer(dt);
    camera.rotation.set(0, 0, 0);
    camera.rotateY(yaw);
    camera.rotateX(pitch);
    if (frame % 2 === 0) updateHover();
    if (now - lastStream > 450) { streamTextures(); lastStream = now; }
    renderer.render(scene, camera);
    frame++;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
init();
</script>
