<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be Kind, Rewind — Video Rental (3D)</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{--neon-core:#ffd9a8;--text:#c9b79c;--text-dim:#7d6a52;--sticker-yellow:#e9c832;--ink:#2b2118}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0b0705;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
#c{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0b0705;z-index:100}
#loading .neon{font-weight:700;letter-spacing:.16em;font-size:clamp(20px,4.5vw,38px);color:var(--neon-core);text-shadow:0 0 4px #ffb054,0 0 14px #ff8a00,0 0 36px #ff6a00}
#loading .sub{font-size:12px;color:var(--text-dim);letter-spacing:.2em}
#crosshair{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:rgba(255,217,168,.85);box-shadow:0 0 6px rgba(255,140,40,.9);z-index:20;pointer-events:none;display:none}
#hover{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:20;pointer-events:none;display:none;background:rgba(16,7,3,.85);border:1px solid #3a2413;border-radius:3px;padding:7px 14px;font-size:13px;color:#e8dcc4;white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#hover .dim{color:var(--text-dim);font-size:11px}
#hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;pointer-events:none;font-size:11px;letter-spacing:.06em;color:var(--text-dim);background:rgba(11,7,5,.7);padding:5px 12px;border-radius:3px;white-space:nowrap}
#topbar{position:fixed;top:12px;left:12px;z-index:20;display:flex;gap:8px}
.hud-link{background:rgba(20,10,4,.8);border:1px solid #3a2413;color:#ffc07a;font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:7px 12px;text-decoration:none;border-radius:2px;text-shadow:0 0 8px rgba(255,130,20,.6)}
.hud-link:hover{border-color:#6b4326}
#touch{position:fixed;bottom:18px;left:18px;z-index:20;display:none;gap:10px}
.tbtn{width:56px;height:56px;border-radius:50%;border:1px solid #3a2413;background:rgba(20,10,4,.75);color:#ffc07a;font-size:20px;line-height:1;user-select:none;-webkit-user-select:none;touch-action:none}
.pull-overlay{position:fixed;inset:0;z-index:200;background:rgba(6,3,2,.88);display:none;align-items:center;justify-content:center;padding:20px}
.pull-overlay.open{display:flex}
.pull-case{width:min(320px,86vw);perspective:1200px}
.pull-inner{position:relative;width:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,1.4,.6,1)}
.pull-inner.flipped{transform:rotateY(180deg)}
@media (prefers-reduced-motion: reduce){.pull-inner{transition:none}}
.pull-face{backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:3px 6px 6px 3px;box-shadow:0 18px 60px rgba(0,0,0,.9),0 0 80px rgba(255,110,0,.08)}

.pull-front img{width:100%;display:block;border-radius:3px 6px 6px 3px;aspect-ratio:2/3;object-fit:cover;background:#17171f}
.pull-front .no-art{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-size:18px;color:var(--text);background:linear-gradient(160deg,#2a2a36,#17171f);border-radius:3px 6px 6px 3px}
.pull-back{position:absolute;inset:0;transform:rotateY(180deg);background:linear-gradient(170deg,#1d1510,#110c08);border:1px solid #35251a;color:#cfc0a4;padding:16px 16px 14px;font-size:12px;line-height:1.55;display:flex;flex-direction:column;overflow:hidden}
.pull-back h2{font-size:15px;color:var(--neon-core);margin-bottom:2px;line-height:1.25;font-weight:700;text-shadow:0 0 10px rgba(255,120,20,.35)}
.pull-back .da-title{font-style:italic;color:#8f7a5c;font-size:11px;margin-bottom:8px}
.pull-back .synopsis{flex:1;overflow-y:auto;margin-bottom:10px;color:#bfae92}
.pull-back .meta-line{font-size:10.5px;color:#8a7458;margin-bottom:3px}
.pull-back .meta-line b{color:#c2a87f;font-weight:600}
.watched-stamp{position:absolute;top:12px;right:12px;border:2px solid;border-radius:3px;font-size:11px;padding:2px 7px;transform:rotate(9deg);opacity:.9}
.stamp-yes{color:#7ec98a;border-color:#7ec98a}
.stamp-no{color:var(--sticker-yellow);border-color:var(--sticker-yellow)}
.barcode{height:26px;margin-top:auto;opacity:.7;background:repeating-linear-gradient(90deg,#cfc0a4 0 2px,transparent 2px 4px,#cfc0a4 4px 7px,transparent 7px 9px,#cfc0a4 9px 10px,transparent 10px 14px)}
.pull-hint{text-align:center;margin-top:14px;font-size:12px;color:#a98c62}
.pull-close{position:absolute;top:-14px;right:-14px;z-index:5;width:34px;height:34px;border-radius:50%;background:#b3402a;color:#f2e8d0;border:none;font-size:17px;line-height:1;cursor:pointer;box-shadow:0 3px 9px rgba(0,0,0,.7)}
#fatal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0705;z-index:150;padding:24px;text-align:center;line-height:1.7}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading"><div class="neon">VIDEO RENTAL</div><div class="sub">OPENING THE STORE…</div></div>

<div class="pull-overlay" id="pull-overlay">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const TEST_MODE = new URLSearchParams(location.search).has('test');
const CSV_URL = 'https://raw.githubusercontent.com/wonderdk/bekindrewind/main/movies.csv';
const TMDB_TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJhdWQiOiIxZTY3N2ZiMTVjMGM4ZDBkNTMzNjQzMGYxNmNlOTFmMiIsIm5iZiI6MTc3NjQxMjk3Mi4zMDIsInN1YiI6IjY5ZTFlOTJjNmJlM2VmOWRmZThiN2I1MCIsInNjb3BlcyI6WyJhcGlfcmVhZCJdLCJ2ZXJzaW9uIjoxfQ.LmxBN4pTZr1OsghaHWA2LkbrqJrGNqftKmyQ1ZUNOQA';

const SECTIONS = [
  { id:'horror',   label:'HORROR',    genres:['Horror'],                            tint:0x4a1616 },
  { id:'scifi',    label:'SCI-FI',    genres:['Sci-Fi','Science Fiction'],          tint:0x1e2f3e },
  { id:'crime',    label:'CRIME',     genres:['Crime'],                             tint:0x322a1c },
  { id:'thriller', label:'THRILLER',  genres:['Thriller','Mystery'],                tint:0x261f30 },
  { id:'action',   label:'ACTION',    genres:['Action','War','Western'],            tint:0x3e2413 },
  { id:'fantasy',  label:'FANTASY',   genres:['Fantasy','Adventure'],               tint:0x243222 },
  { id:'kids',     label:'KIDS',      genres:['Animation','Family'],                tint:0x352b14 },
  { id:'comedy',   label:'COMEDY',    genres:['Comedy','Music'],                    tint:0x3b3216 },
  { id:'drama',    label:'DRAMA',     genres:['Drama','Romance','History','Documentary'], tint:0x2c211a },
  { id:'misc',     label:'MISC',      genres:[],                                    tint:0x262626 }
];

function parseCSV(text) {
  const rows = [];
  const lines = text.trim().split('\n');
  const parseLine = (line) => {
    const vals = []; let cur = '', inQ = false;
    for (let j = 0; j < line.length; j++) {
      const ch = line[j];
      if (ch === '"') { if (inQ && line[j+1] === '"') { cur += '"'; j++; continue; } inQ = !inQ; continue; }
      if (ch === ',' && !inQ) { vals.push(cur.trim()); cur = ''; continue; }
      cur += ch;
    }
    vals.push(cur.trim());
    return vals;
  };
  const headers = parseLine(lines[0]);
  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const vals = parseLine(lines[i]);
    if (vals.length < headers.length) continue;
    const obj = {};
    headers.forEach((h, idx) => obj[h] = vals[idx] || '');
    if (obj.uid) rows.push(obj);
  }
  return rows;
}
function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function sectionFor(m) {
  const genres = (m.genre_ids || '').split('|').map(g => g.trim()).filter(Boolean);
  for (const s of SECTIONS) if (s.genres.some(g => genres.includes(g))) return s;
  return SECTIONS[SECTIONS.length - 1];
}
function seededPicks(pool, n) {
  const d = new Date();
  let seed = d.getFullYear()*10000 + (d.getMonth()+1)*100 + d.getDate();
  const rand = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
  const arr = pool.slice();
  for (let i = arr.length-1; i > 0; i--) { const j = Math.floor(rand()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; }
  return arr.slice(0, n);
}
// deterministic per-film jitter so the shelves look hand-stocked, not machine-placed
function jitter(uid, salt) {
  let h = salt;
  const s = String(uid);
  for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 1000003;
  return (h % 1000) / 1000 - 0.5; // -0.5..0.5
}

/* ── store geometry plan ──
   A long narrow corridor shop, like the photo.
   x: walls at ±1.88, case faces at ±1.42 (aisle 2.84 across)
   z: entrance wall +2.2 … back wall -9.9
   Side runs: z -0.75 → -9.15 (8.4 m), 6 levels
   Back run: under the neon, x -1.35..1.35, 5 levels  */
const LEVELS6 = [0.30, 0.66, 1.02, 1.38, 1.74, 2.10];
const LEVELS5 = LEVELS6.slice(0, 5);
const CASE_W = 0.135, CASE_H = 0.19;
function buildRuns() {
  return [
    { name:'west', x0:-1.42, z0:-0.78, dx:0, dz:-1, rotY: Math.PI/2, len:8.4, levels:LEVELS6 },
    { name:'east', x0: 1.42, z0:-0.78, dx:0, dz:-1, rotY:-Math.PI/2, len:8.4, levels:LEVELS6 },
    { name:'back', x0:-1.32, z0:-9.42, dx:1, dz:0, rotY:0,           len:2.64, levels:LEVELS5 }
  ];
}
function chooseSpacing(count) {
  for (const s of [0.158, 0.152, 0.148, 0.145, 0.142]) {
    const cap = buildRuns().reduce((a,r) => a + Math.floor(r.len/s) * r.levels.length, 0);
    if (cap >= count) return s;
  }
  return 0.142;
}
function assignSlots(bySection, count) {
  const runs = buildRuns();
  const S = chooseSpacing(count);
  const placements = [], signs = [];
  let r = 0, level = 0, i = 0;
  const perRun = runs.map(rn => Math.floor(rn.len / S));
  const next = () => {
    while (r < runs.length) {
      const rn = runs[r];
      if (i < perRun[r]) {
        const off = (S/2) + i*S;
        const slot = {
          x: rn.x0 + rn.dx*off, z: rn.z0 + rn.dz*off,
          y: rn.levels[level], rotY: rn.rotY, run: rn.name
        };
        level++; // fill the bay top-to-bottom first, then move along the run
        if (level >= rn.levels.length) { level = 0; i++; if (i >= perRun[r]) { i = 0; r++; } }
        return slot;
      }
      i = 0; level = 0; r++;
    }
    return null;
  };
  for (const sec of SECTIONS) {
    const films = bySection[sec.id] || [];
    if (!films.length) continue;
    let first = true;
    for (const m of films) {
      const slot = next();
      if (!slot) return { placements, signs, spacing:S, overflow:true };
      if (first && slot.y === LEVELS6[0]) { /* sign only reads well higher up */ }
      if (first) { signs.push({ label: sec.label, x: slot.x, z: slot.z, rotY: slot.rotY }); first = false; }
      placements.push({ m, sec, ...slot });
    }
  }
  // center the back run's used columns so the leftover space splits evenly
  const backPl = placements.filter(p => p.run === 'back');
  if (backPl.length) {
    const backRun = runs.find(rn => rn.name === 'back');
    const usedLen = Math.max(...backPl.map(p => p.x)) - Math.min(...backPl.map(p => p.x)) + S;
    const shift = (backRun.len - usedLen) / 2 - (Math.min(...backPl.map(p => p.x)) - backRun.x0 - S/2);
    for (const p of backPl) p.x += shift;
    for (const g of signs) if (Math.abs(g.z - backRun.z0) < 0.01) g.x += shift;
  }
  return { placements, signs, spacing:S, overflow:false };
}

/* ── canvas textures ── */
function neonCanvas() {
  const c = document.createElement('canvas'); c.width = 1024; c.height = 340;
  const x = c.getContext('2d');
  x.clearRect(0,0,c.width,c.height);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '700 128px Arial Narrow, Arial, sans-serif';
  for (const [blur,col] of [[58,'rgba(255,80,0,.85)'],[30,'#ff6a00'],[14,'#ff9a20']]) {
    x.shadowColor = col; x.shadowBlur = blur; x.fillStyle = '#ffdcb0';
    x.fillText('VIDEO RENTAL', 512, 140);
  }
  x.shadowBlur = 0; x.fillStyle = '#fff0d8'; x.fillText('VIDEO RENTAL', 512, 140);
  x.font = '600 40px Arial, sans-serif';
  x.shadowColor = '#ff8a00'; x.shadowBlur = 20; x.fillStyle = '#e8a45f';
  x.fillText('BE KIND • REWIND', 512, 262);
  x.shadowBlur = 0;
  return c;
}
function tagCanvas(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 72;
  const x = c.getContext('2d');
  x.fillStyle = '#120a05'; x.fillRect(0,0,256,72);
  x.strokeStyle = '#4a2d14'; x.lineWidth = 4; x.strokeRect(2,2,252,68);
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = '700 34px Arial Narrow, Arial, sans-serif';
  x.shadowColor = '#ff8a00'; x.shadowBlur = 14; x.fillStyle = '#ffd9a8';
  x.fillText(text, 128, 38);
  x.shadowBlur = 6; x.fillText(text, 128, 38);
  return c;
}
function noteCanvas(text) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 100;
  const x = c.getContext('2d');
  x.fillStyle = '#e3c235'; x.fillRect(0,0,256,100);
  x.fillStyle = 'rgba(0,0,0,.08)'; x.fillRect(0,84,256,16);
  x.fillStyle = '#2b2118'; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = 'italic 700 27px Comic Sans MS, cursive, sans-serif';
  const words = text.split(' ');
  if (words.length > 2) { x.fillText(words.slice(0,2).join(' '), 128, 34); x.fillText(words.slice(2).join(' '), 128, 66); }
  else x.fillText(text, 128, 50);
  return c;
}
function carpetCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#260b0a'; x.fillRect(0,0,256,256);
  for (let i = 0; i < 3200; i++) {
    const v = Math.random();
    x.fillStyle = v < .5 ? 'rgba(0,0,0,.35)' : (v < .88 ? 'rgba(85,26,24,.25)' : 'rgba(140,60,42,.12)');
    const s = Math.random() < .8 ? 2 : 3;
    x.fillRect(Math.random()*256, Math.random()*256, s, s);
  }
  return c;
}
function glowPoolCanvas() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 256;
  const x = c.getContext('2d');
  const g = x.createRadialGradient(128,128,10,128,128,128);
  g.addColorStop(0, 'rgba(255,120,20,.75)');
  g.addColorStop(.5, 'rgba(255,100,10,.30)');
  g.addColorStop(1, 'rgba(255,90,0,0)');
  x.fillStyle = g; x.fillRect(0,0,256,256);
  return c;
}
function fakePosterCanvas(m, tint) { // TEST_MODE only: stand-in cover art
  const c = document.createElement('canvas'); c.width = 92; c.height = 138;
  const x = c.getContext('2d');
  const h = ((tint >> 16 & 255) + (tint >> 8 & 255)) % 360;
  const g = x.createLinearGradient(0,0,0,138);
  g.addColorStop(0, `hsl(${(h + parseInt(m.uid)*37) % 360} 30% 33%)`);
  g.addColorStop(1, `hsl(${(h + parseInt(m.uid)*37 + 40) % 360} 34% 13%)`);
  x.fillStyle = g; x.fillRect(0,0,92,138);
  x.fillStyle = 'rgba(255,255,255,.85)'; x.textAlign = 'center';
  x.font = '700 11px Arial'; 
  const t = m.title.slice(0, 22);
  x.fillText(t.slice(0, 11), 46, 60);
  x.fillText(t.slice(11), 46, 74);
  return c;
}

/* ── state ── */
let renderer, scene, camera, movies = [];
const posterMeshes = [];
const colliders = [];
const texState = new Map();
const overviewCache = new Map();
let locked = false, yaw = 0, pitch = 0;
const keys = {};
let touchFwd = 0;
let staticTex = null, staticCtx = null;

function fail(msg) {
  document.getElementById('loading').style.display = 'none';
  const f = document.getElementById('fatal');
  f.style.display = 'flex';
  f.innerHTML = msg + '<br><br><a class="hud-link" href="store.html">Go to the 2D store</a>';
}
function lam(color, emissive){ return new THREE.MeshLambertMaterial({ color, emissive: emissive || 0x000000 }); }
function box(w,h,d,mat,x,y,z){ const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); scene.add(m); return m; }
function addCollider(minX,maxX,minZ,maxZ){ colliders.push({minX,maxX,minZ,maxZ}); }

function buildRoom() {
  scene.background = new THREE.Color(0x0b0705);
  scene.fog = new THREE.Fog(0x0b0705, 3.5, 15);

  // carpet
  const carpetTex = new THREE.CanvasTexture(carpetCanvas());
  carpetTex.wrapS = carpetTex.wrapT = THREE.RepeatWrapping; carpetTex.repeat.set(5, 16);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 12.4), new THREE.MeshLambertMaterial({ map: carpetTex }));
  floor.rotation.x = -Math.PI/2; floor.position.set(0, 0, -3.85); scene.add(floor);
  // warm pool of neon light on the carpet toward the back
  const pool = new THREE.Mesh(new THREE.PlaneGeometry(3.6, 6.5),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(glowPoolCanvas()), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false }));
  pool.rotation.x = -Math.PI/2; pool.position.set(0, 0.012, -7.2); scene.add(pool);

  // ceiling + walls
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(3.8, 12.4), lam(0x090604));
  ceil.rotation.x = Math.PI/2; ceil.position.set(0, 2.8, -3.85); scene.add(ceil);
  const wallMat = lam(0x0d0805);
  const mkWall = (w,h,x,y,z,ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w,h), wallMat); m.position.set(x,y,z); m.rotation.y = ry; scene.add(m); };
  mkWall(3.8, 2.8, 0, 1.4, -9.9, 0);
  mkWall(3.8, 2.8, 0, 1.4,  2.35, Math.PI);
  mkWall(12.4, 2.8, -1.88, 1.4, -3.85,  Math.PI/2);
  mkWall(12.4, 2.8,  1.88, 1.4, -3.85, -Math.PI/2);

  // entrance: dark door with cold street light seeping in behind the player
  const door = box(0.9, 2.05, 0.06, lam(0x0b0c0f), 0.55, 1.02, 2.31);
  const street = new THREE.PointLight(0x7fa4c4, 0.35, 4.5); street.position.set(0.55, 1.6, 1.6); scene.add(street);

  /* shelf carcasses: back panel + boards + uprights + crown */
  const woodBack = lam(0x100904), woodBoard = lam(0x180e07), woodEdge = lam(0x160d05);
  const buildShelfRun = (side) => { // side: -1 west, +1 east
    const x = side * 1.66;
    box(0.44, 2.55, 8.9, woodBack, x, 1.275, -4.95);
    for (const y of [...LEVELS6, 2.46]) {
      box(0.4, 0.028, 8.7, woodBoard, side*1.60, y - 0.028, -4.95);
    }
    // uprights every ~2.1m
    for (const z of [-0.72, -2.82, -4.92, -7.02, -9.12]) {
      box(0.4, 2.5, 0.035, woodEdge, side*1.60, 1.25, z);
    }
    box(0.42, 0.09, 8.8, woodEdge, side*1.61, 2.52, -4.95); // crown
    box(0.42, 0.10, 8.8, lam(0x0b0603), side*1.61, 0.05, -4.95); // kick
    addCollider(side < 0 ? -1.95 : 1.38, side < 0 ? -1.38 : 1.95, -9.3, -0.6);
    // clutter boxes on top (deterministic)
    for (let i = 0; i < 9; i++) {
      const zz = -1.1 - i*0.92 + jitter(i, side < 0 ? 7 : 13)*0.4;
      const w = 0.22 + Math.abs(jitter(i, 3))*0.25, h = 0.14 + Math.abs(jitter(i, 5))*0.2;
      const tone = [0x150e0a, 0x121016, 0x170c08, 0x131310][i % 4];
      box(0.3, h, w, lam(tone), side*1.62, 2.57 + h/2, zz);
    }
  };
  buildShelfRun(-1);
  buildShelfRun( 1);
  // back run carcass (5 levels, neon above)
  box(3.5, 2.2, 0.4, woodBack, 0, 1.1, -9.66); addCollider(-1.9, 1.9, -9.95, -9.36);
  for (const y of [...LEVELS5, 2.12]) box(3.0, 0.028, 0.36, woodBoard, 0, y - 0.028, -9.60);
  box(3.1, 0.09, 0.38, woodEdge, 0, 2.2, -9.60);

  // neon above the back shelf
  const neonMat = new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(neonCanvas()), transparent: true, fog: false });
  neonMat.toneMapped = false;
  const neon = new THREE.Mesh(new THREE.PlaneGeometry(2.6, 0.82), neonMat);
  neon.position.set(0, 2.5, -9.86); scene.add(neon);
  const orange = new THREE.PointLight(0xff7a10, 1.4, 10); orange.position.set(0, 2.15, -8.9); scene.add(orange);
  const orangeMid = new THREE.PointLight(0xff8a20, 0.5, 7); orangeMid.position.set(0, 1.6, -5.2); scene.add(orangeMid);

  // one fluorescent tube up front (the photo's single cool light), slightly askew
  const tubeGrp = new THREE.Group();
  const fixture = box(0.16, 0.05, 1.15, lam(0x1d1610), 0, 0, 0); tubeGrp.add(fixture); scene.remove(fixture); tubeGrp.add(fixture);
  const tube = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.05, 1.05), new THREE.MeshLambertMaterial({ color: 0xf2fbfd, emissive: 0xe8f6f8 }));
  tube.position.y = -0.045; tubeGrp.add(tube);
  tubeGrp.position.set(0.1, 2.74, -1.35);
  tubeGrp.rotation.y = 0.5;
  scene.add(tubeGrp);
  const cool = new THREE.PointLight(0xdcf2f6, 0.55, 5); cool.position.set(0.1, 2.55, -1.35); scene.add(cool);
  const coolSpot = new THREE.SpotLight(0xcfe9ee, 0.45, 6, 0.7, 0.65);
  coolSpot.position.set(0.1, 2.7, -1.35); coolSpot.target.position.set(0.1, 0, -1.35);
  scene.add(coolSpot); scene.add(coolSpot.target);
  // a second, dimmer tube deeper in (geometry mostly, faint light)
  const tube2 = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.05, 1.0), new THREE.MeshLambertMaterial({ color: 0xcfe0e2, emissive: 0x9fb8ba }));
  tube2.position.set(-0.15, 2.72, -6.4); tube2.rotation.y = -0.35; scene.add(tube2);
  const cool2 = new THREE.PointLight(0xcfe9ee, 0.22, 4); cool2.position.set(-0.15, 2.55, -6.4); scene.add(cool2);

  scene.add(new THREE.AmbientLight(0x4a3322, 0.18));

  // counter at the entrance, west side, with a CRT playing static
  box(1.0, 0.92, 0.5, lam(0x22150c), -1.28, 0.46, 1.35); addCollider(-1.85, -0.75, 1.05, 1.65);
  box(1.04, 0.05, 0.54, woodEdge, -1.28, 0.945, 1.35);
  const crtBody = box(0.42, 0.34, 0.4, lam(0x2a2a2e), -1.3, 1.14, 1.35);
  staticCtx = document.createElement('canvas').getContext('2d');
  staticCtx.canvas.width = 64; staticCtx.canvas.height = 48;
  staticTex = new THREE.CanvasTexture(staticCtx.canvas);
  const crtScreen = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.23),
    new THREE.MeshBasicMaterial({ map: staticTex }));
  crtScreen.position.set(-1.3, 1.15, 1.148); crtScreen.rotation.y = Math.PI; scene.add(crtScreen);
  const crtGlow = new THREE.PointLight(0x8ec6ff, 0.4, 2.6); crtGlow.position.set(-1.3, 1.2, 0.9); scene.add(crtGlow);
  const note = new THREE.Mesh(new THREE.PlaneGeometry(0.34, 0.135),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(noteCanvas('PLEASE REWIND !')) }));
  note.position.set(-1.05, 0.72, 1.096); note.rotation.y = Math.PI; note.rotation.z = 0.05; scene.add(note);
}

function updateStatic() {
  if (!staticCtx) return;
  const img = staticCtx.createImageData(64, 48);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = Math.random() * 190 + 20;
    img.data[i] = v * 0.75; img.data[i+1] = v * 0.85; img.data[i+2] = v; img.data[i+3] = 255;
  }
  staticCtx.putImageData(img, 0, 0);
  staticTex.needsUpdate = true;
}

function buildCases() {
  const visible = movies.filter(m => m.hidden !== 'true');
  const bySection = {};
  SECTIONS.forEach(s => bySection[s.id] = []);
  visible.forEach(m => bySection[sectionFor(m).id].push(m));
  SECTIONS.forEach(s => bySection[s.id].sort((a,b) => a.title.localeCompare(b.title)));

  const { placements, signs, spacing, overflow } = assignSlots(bySection, visible.length);
  if (overflow) console.warn('shelf capacity exceeded');

  const bodyGeo = new THREE.BoxGeometry(CASE_W + 0.004, CASE_H + 0.006, 0.026);
  const bodies = new THREE.InstancedMesh(bodyGeo, lam(0x101014), placements.length);
  const dummy = new THREE.Object3D();
  const planeGeo = new THREE.PlaneGeometry(CASE_W, CASE_H);

  placements.forEach((p, idx) => {
    const jr = jitter(p.m.uid, 1) * 0.05;   // tiny rotation
    const jn = jitter(p.m.uid, 2) * 0.008;  // in/out of shelf
    const rotY = p.rotY + jr;
    const nx = Math.sin(rotY), nz = Math.cos(rotY);
    const px = p.x + Math.sin(p.rotY) * jn, pz = p.z + Math.cos(p.rotY) * jn;

    dummy.position.set(px, p.y + CASE_H/2, pz);
    dummy.rotation.set(0, rotY, 0);
    dummy.updateMatrix();
    bodies.setMatrixAt(idx, dummy.matrix);

    const mat = lam(p.sec.tint);
    const plane = new THREE.Mesh(planeGeo, mat);
    plane.position.set(px + nx*0.0155, p.y + CASE_H/2, pz + nz*0.0155);
    plane.rotation.y = rotY;
    plane.userData.m = p.m;
    scene.add(plane);
    posterMeshes.push(plane);
    if (p.m.poster_url || TEST_MODE) {
      texState.set(p.m.uid, { mesh: plane, m: p.m, tint: p.sec.tint,
        url: (p.m.poster_url || '').replace('/w300','/w185'), tex: null, loading: false });
    }
  });
  scene.add(bodies);

  // section tags on the crown board
  for (const s of signs) {
    const nx = Math.sin(s.rotY), nz = Math.cos(s.rotY);
    const tag = new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.15),
      new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(tagCanvas(s.label)) }));
    tag.position.set(s.x + nx*0.20, s.rotY === 0 ? 2.04 : 2.36, s.z + nz*0.20);
    tag.rotation.y = s.rotY;
    scene.add(tag);
  }

  // gondola mid-aisle with tonight's picks facing the entrance
  const picks = seededPicks(visible.filter(m => m.watched !== 'true' && m.poster_url), 6);
  const woodEdge = lam(0x3c2712);
  box(0.68, 1.02, 1.7, lam(0x160b05), 0, 0.51, -3.9); addCollider(-0.36, 0.36, -4.77, -3.03);
  // a few tapes lying on top and a returns tray, so the surface isn't a bare slab
  box(0.14, 0.03, 0.2, lam(0x101014), -0.18, 1.085, -3.62);
  box(0.14, 0.03, 0.2, lam(0x14100c), -0.16, 1.115, -3.64);
  box(0.2, 0.03, 0.14, lam(0x0e0e12),  0.17, 1.085, -4.0);
  box(0.34, 0.1, 0.26, lam(0x1a1206),  0.02, 1.12, -4.45);
  box(0.72, 0.05, 1.74, lam(0x100804), 0, 1.045, -3.9);
  const dispLight = new THREE.PointLight(0xffc27a, 0.35, 2.2); dispLight.position.set(0, 1.5, -2.65); scene.add(dispLight);
  const backNote = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.16),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(noteCanvas('3 FOR 2 FRIDAYS')) }));
  backNote.position.set(0, 0.7, -4.776); backNote.rotation.y = Math.PI; scene.add(backNote);
  box(0.66, 1.28, 0.04, lam(0x170d06), 0, 0.66, -3.03);
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.38, 0.15),
    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(noteCanvas("TONIGHT'S PICKS")) }));
  sign.position.set(0, 1.14, -3.006); scene.add(sign);
  const planeGeo2 = new THREE.PlaneGeometry(CASE_W, CASE_H);
  picks.forEach((m, k) => {
    const row = Math.floor(k / 3), col = k % 3;
    const plane = new THREE.Mesh(planeGeo2, lam(0x22222c));
    plane.scale.set(1.22, 1.22, 1);
    plane.position.set(-0.2 + col*0.2, 0.84 - row*0.3, -3.004);
    plane.userData.m = m;
    scene.add(plane);
    posterMeshes.push(plane);
    texState.set('pick-' + m.uid, { mesh: plane, m, tint: 0x22222c, prio: true,
      url: m.poster_url.replace('/w300','/w185'), tex: null, loading: false });
  });
}

/* ── texture streaming (proximity + budget) ── */
const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
const TEX_BUDGET = 340, LOAD_NEAR = 9, CONCURRENT = 10;
let inflight = 0;
function applyTex(e, tex) {
  e.tex = tex;
  e.mesh.material.map = tex;
  e.mesh.material.color.set(0xffffff);
  e.mesh.material.needsUpdate = true;
}
function streamTextures() {
  const cx = camera.position.x, cz = camera.position.z;
  const entries = [...texState.values()];
  for (const e of entries) {
    const dx = e.mesh.position.x - cx, dz = e.mesh.position.z - cz;
    e.d2 = (dx*dx + dz*dz) * (e.prio ? 0.15 : 1); // display picks always win their spot
  }
  entries.sort((a,b) => a.d2 - b.d2);
  // want-set: the nearest in-range entries, up to the budget
  const want = new Set();
  for (const e of entries) {
    if (want.size >= TEX_BUDGET) break;
    if (e.failed) continue;
    if (e.d2 > LOAD_NEAR*LOAD_NEAR) break;
    want.add(e);
  }
  // evict anything loaded that is no longer wanted, so nearer covers get room
  for (const e of entries) {
    if (e.tex && !want.has(e)) {
      e.mesh.material.map = null;
      e.mesh.material.color.set(e.tint);
      e.mesh.material.needsUpdate = true;
      e.tex.dispose(); e.tex = null;
    }
  }
  // load missing wanted entries, nearest first
  for (const e of entries) {
    if (inflight >= CONCURRENT) break;
    if (!want.has(e) || e.tex || e.loading) continue;
    e.loading = true; inflight++;
    if (TEST_MODE) {
      setTimeout(() => { inflight--; e.loading = false; applyTex(e, new THREE.CanvasTexture(fakePosterCanvas(e.m, e.tint))); }, 20);
    } else {
      texLoader.load(e.url, tex => { inflight--; e.loading = false; applyTex(e, tex); },
        undefined, () => { inflight--; e.loading = false; e.failed = true; });
    }
  }
}

/* ── controls ── */
function setupControls(canvas) {
  canvas.addEventListener('click', () => {
    if (document.getElementById('pull-overlay').classList.contains('open')) return;
    if (!locked) { canvas.requestPointerLock?.(); return; }
    if (hovered) openCase(hovered.userData.m);
  });
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === canvas;
    document.getElementById('crosshair').style.display = locked ? 'block' : 'none';
  });
  document.addEventListener('mousemove', e => {
    if (!locked) return;
    yaw   -= e.movementX * 0.0022;
    pitch -= e.movementY * 0.0022;
    pitch = Math.max(-1.3, Math.min(1.3, pitch));
  });
  document.addEventListener('keydown', e => { keys[e.code] = true; });
  document.addEventListener('keyup',   e => { keys[e.code] = false; });

  let lastTouch = null;
  canvas.addEventListener('touchstart', e => { lastTouch = e.touches[0]; }, { passive: true });
  canvas.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (lastTouch) {
      yaw   -= (t.clientX - lastTouch.clientX) * 0.004;
      pitch -= (t.clientY - lastTouch.clientY) * 0.004;
      pitch = Math.max(-1.3, Math.min(1.3, pitch));
    }
    lastTouch = t;
  }, { passive: true });
  canvas.addEventListener('touchend', () => { lastTouch = null; }, { passive: true });
  const bind = (id, v) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); touchFwd = v; }, { passive: false });
    el.addEventListener('touchend',   e => { e.preventDefault(); touchFwd = 0; }, { passive: false });
  };
  bind('t-fwd', 1); bind('t-back', -1);
  if ('ontouchstart' in window) {
    document.getElementById('touch').style.display = 'flex';
    document.getElementById('hint').textContent = 'Drag to look · hold ▲ to walk · tap a cover to pull it';
    canvas.addEventListener('touchend', e => {
      if (e.changedTouches.length !== 1) return;
      const t = e.changedTouches[0];
      const hit = raycastAt((t.clientX/innerWidth)*2 - 1, -(t.clientY/innerHeight)*2 + 1);
      if (hit) openCase(hit.userData.m);
    }, { passive: true });
  }
}
function movePlayer(dt) {
  const speed = 2.2;
  let fwd = (keys.KeyW || keys.ArrowUp ? 1 : 0) - (keys.KeyS || keys.ArrowDown ? 1 : 0) + touchFwd;
  let strafe = (keys.KeyD || keys.ArrowRight ? 1 : 0) - (keys.KeyA || keys.ArrowLeft ? 1 : 0);
  if (!fwd && !strafe) return;
  const len = Math.hypot(fwd, strafe) || 1;
  fwd /= len; strafe /= len;
  const sin = Math.sin(yaw), cos = Math.cos(yaw);
  const dx = (-sin * fwd + cos * strafe) * speed * dt;
  const dz = (-cos * fwd - sin * strafe) * speed * dt;
  const r = 0.26;
  const blocked = (x, z) => {
    for (const c of colliders) if (x > c.minX - r && x < c.maxX + r && z > c.minZ - r && z < c.maxZ + r) return true;
    return false;
  };
  let nx = camera.position.x + dx;
  nx = Math.max(-1.62 + r, Math.min(1.62 - r, nx));
  if (!blocked(nx, camera.position.z)) camera.position.x = nx;
  let nz = camera.position.z + dz;
  nz = Math.max(-9.36 + r, Math.min(2.1 - r, nz));
  if (!blocked(camera.position.x, nz)) camera.position.z = nz;
}

/* ── hover + open ── */
const raycaster = new THREE.Raycaster();
raycaster.far = 3.4;
let hovered = null;
function raycastAt(ndcX, ndcY) {
  raycaster.setFromCamera({ x: ndcX, y: ndcY }, camera);
  const hits = raycaster.intersectObjects(posterMeshes, false);
  return hits.length ? hits[0].object : null;
}
function updateHover() {
  hovered = locked ? raycastAt(0, 0) : null;
  const el = document.getElementById('hover');
  if (hovered) {
    const m = hovered.userData.m;
    el.innerHTML = `${escHtml(m.title)} <span class="dim">(${escHtml(m.year)}) · ${escHtml(m.format)}${m.watched === 'true' ? '' : ' · NOT SEEN'}</span>`;
    el.style.display = 'block';
  } else el.style.display = 'none';
}

/* ── flip-case overlay ── */
const overlay = document.getElementById('pull-overlay');
const inner = document.getElementById('pull-inner');
async function fetchOverview(m) {
  if (overviewCache.has(m.uid)) return overviewCache.get(m.uid);
  if (!/^tt\d{7,8}$/.test(m.imdb_id) || m.imdb_id === 'tt0000000') return '';
  try {
    const hdrs = { Authorization: `Bearer ${TMDB_TOKEN}` };
    const f = await fetch(`https://api.themoviedb.org/3/find/${m.imdb_id}?external_source=imdb_id`, { headers: hdrs }).then(r => r.json());
    const id0 = f.movie_results?.[0]?.id;
    const id = id0 || f.tv_results?.[0]?.id;
    const kind = id0 ? 'movie' : 'tv';
    if (!id) return '';
    const d = await fetch(`https://api.themoviedb.org/3/${kind}/${id}`, { headers: hdrs }).then(r => r.json());
    const ov = d.overview || '';
    overviewCache.set(m.uid, ov);
    return ov;
  } catch(e) { return ''; }
}
async function openCase(m) {
  if (!m) return;
  document.exitPointerLock?.();
  const front = document.getElementById('pull-front');
  const back = document.getElementById('pull-back');
  inner.classList.remove('flipped');
  front.innerHTML = m.poster_url
    ? `<img src="${escHtml(m.poster_url.replace('/w300','/w500'))}" alt="${escHtml(m.title)}">`
    : `<div class="no-art">${escHtml(m.title)}</div>`;
  const watched = m.watched === 'true';
  const actors = (m.actors || '').split('|').filter(a => a && a !== '-').join(', ');
  back.innerHTML = `
    <div class="watched-stamp ${watched ? 'stamp-yes' : 'stamp-no'}">${watched ? 'SEEN' : 'NOT SEEN'}</div>
    <h2>${escHtml(m.title)}</h2>
    ${m.title_da && m.title_da !== m.title ? `<div class="da-title">${escHtml(m.title_da)}</div>` : '<div class="da-title"></div>'}
    <div class="synopsis" id="pull-synopsis">Fetching the back-cover text…</div>
    ${m.director ? `<div class="meta-line"><b>Director:</b> ${escHtml(m.director)}</div>` : ''}
    ${actors ? `<div class="meta-line"><b>Starring:</b> ${escHtml(actors)}</div>` : ''}
    <div class="meta-line"><b>${escHtml(m.year)}</b> · ${escHtml(m.format)}${m.runtime && m.runtime !== '0' ? ` · ${escHtml(m.runtime)} min` : ''}${m.box_set ? ` · From the box set: ${escHtml(m.box_set)}` : ''}</div>
    <div class="barcode"></div>`;
  overlay.classList.add('open');
  const ov = await fetchOverview(m);
  const syn = document.getElementById('pull-synopsis');
  if (syn) syn.textContent = ov || 'The back-cover text has gone missing. Ask at the counter.';
}
inner.addEventListener('click', e => { if (e.target.id !== 'pull-close') inner.classList.toggle('flipped'); });
document.getElementById('pull-close').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });

/* ── boot ── */
async function init() {
  const canvas = document.getElementById('c');
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
  catch(e) { return fail('Your browser could not start WebGL, so the 3D store cannot open.'); }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.95;

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.05, 40);
  camera.position.set(0, 1.5, 1.7);
  yaw = 0; pitch = -0.03;

  try {
    const res = await fetch(CSV_URL + '?t=' + Date.now());
    movies = parseCSV(await res.text());
  } catch(e) {
    return fail('The shop could not open: the film database did not load. Check your connection and reload.');
  }

  buildRoom();
  buildCases();
  setupControls(canvas);

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  document.getElementById('loading').style.display = 'none';

  let last = performance.now(), frame = 0, lastStream = 0, lastStatic = 0;
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    movePlayer(dt);
    camera.rotation.set(0, 0, 0);
    camera.rotateY(yaw);
    camera.rotateX(pitch);
    if (frame % 2 === 0) updateHover();
    if (now - lastStream > 420) { streamTextures(); lastStream = now; }
    if (now - lastStatic > 130) { updateStatic(); lastStatic = now; }
    renderer.render(scene, camera);
    frame++;
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // test hook for headless screenshot iteration
  window.__test = {
    ready: true,
    setCam(x, z, y, yw, pt) { camera.position.set(x, y, z); yaw = yw; pitch = pt; },
    counts: () => ({ films: posterMeshes.length, textures: [...texState.values()].filter(e => e.tex).length })
  };
}
init();
</script>
